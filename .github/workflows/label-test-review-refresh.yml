name: 95 - Refresh Label Test After Review

on:
  workflow_run:
    workflows:
      - 96 - Label Test Review Signal
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  refresh-label-test:
    name: Refresh Label Test
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: write
      contents: read
    uses: Achrobat/Achrobat-Label-Sync/.github/workflows/96-refresh-label-test.yml@master
    with:
      label_sync_repository: Achrobat/Achrobat-Label-Sync
      label_sync_ref: master
      target_repository: ${{ github.repository }}
      review_signal_run_id: ${{ github.event.workflow_run.id }}
